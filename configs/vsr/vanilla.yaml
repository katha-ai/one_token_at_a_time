# VSR (Visual Spatial Reasoning), vanilla: the model is shown an image and a
# caption describing a spatial relation between two objects, and asked to
# answer with the relation as it perceives it from the image.

experiment_name: "vsr"
save_dir: "./outputs/vsr/vanilla/qvl_7b"
device: "auto"

data:
  csv_path: "data/csv/vsr_filtered_task_gemini.csv"
  image_base_dir: "data/images"
  black_image_path: "data/blank_black_image.png"

generation:
  num_tokens_to_generate: 128

model:
  type: "qwen_25_vl"
  model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
  torch_dtype: "bfloat16"
  attn_implementation: "eager"

task:
  image_type: 'actual'
  name: "vsr"
  prompt_template: 'vsr_prompt_vanilla'

blocking:
  use_blocking: False

boosting:
  use_boosting: False
