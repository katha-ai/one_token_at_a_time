# VSR with multiplicative attention boosting: 'image' attention is amplified
# while the model generates the image-perceived spatial relation
# (IMG_SPATIAL_RELATION) — the corrective direction for "lazy"/text-anchored
# VLM behavior on this task.

experiment_name: "vsr"
save_dir: "./outputs/vsr/boosting/qvl_7b"
device: "auto"

data:
  csv_path: "data/csv/vsr_filtered_task_gemini.csv"
  image_base_dir: "data/images"
  black_image_path: "data/blank_black_image.png"

generation:
  num_tokens_to_generate: 128

model:
  type: "qwen_25_vl"
  model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
  torch_dtype: "bfloat16"
  attn_implementation: "eager"

task:
  image_type: 'actual'
  name: "vsr"
  prompt_template: 'vsr_prompt_discrepancy_updated'

blocking:
  use_blocking: False

boosting:
  use_boosting: True
  chunk_to_boost: ['image']
  boost_factor: 1.5
  layers_to_boost: 'all'
  style:
    type: 'precomputed'
    pos_dir: 'data/tagged_outputs/otat_tagged_outputs/vsr/vanilla'
    model: 'qvl_7b'
    pos_tag_to_block: ['IMG_SPATIAL_RELATION']
