# Fruit-Math with attention blocking: the 'image' chunk's attention is zeroed
# out (lazy = only the last query row per step) for the generation step(s)
# where the model produces the FRUIT_CONCEPT span, using precomputed POS-tag
# positions. Requires the POS-tagged generations described in the top-level
# README's data section (data/tagged_outputs/...).

experiment_name: "fruit_math"
save_dir: "./outputs/fruit_math/blocking/qvl_7b"
device: "auto"

data:
  csv_path: "data/csv/fruit_math_oid_scaled1K.csv"
  image_base_dir: "data"
  black_image_path: "data/blank_black_image.png"

generation:
  num_tokens_to_generate: 25

model:
  type: "qwen_25_vl"
  model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
  torch_dtype: "bfloat16"
  attn_implementation: "eager"

task:
  image_type: 'actual'
  name: "fruit_math"
  prompt_template: 'fruit_math_prompt'

blocking:
  use_blocking: True
  chunk_to_block: 'image'
  method: 'lazy' # 'lazy' | 'total'
  style:
    type: 'precomputed'
    pos_dir: 'data/tagged_outputs/otat_tagged_outputs/FrMaSc'
    model: 'qvl_7b'
    pos_tag_to_block: ['FRUIT_CONCEPT']

boosting:
  use_boosting: False
