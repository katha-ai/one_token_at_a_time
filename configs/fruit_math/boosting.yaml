# Fruit-Math with multiplicative attention boosting: 'image' attention is
# amplified while the model generates the FRUIT_CONCEPT span, and 'text'
# attention while it generates the MATH_ANSWER span (chunk_to_boost and
# pos_tag_to_block are zipped positionally). only_first boosts just the first
# matched token of each span. Requires the same precomputed POS tags as
# blocking.yaml.
#
# NOTE: unlike VSR and Fruit-Sport, we can't ship precomputed POS tags for
# Fruit-Math in the released dataset - the only POS-tagging output we have on
# hand is the raw Gemini batch-response JSONL with no per-sample identifier
# in it, so it can't be reliably split back into the per-sample files this
# config's pos_dir expects. To run this config, first generate your own
# tags for pos_dir='data/tagged_outputs/otat_tagged_outputs/FrMaSc/<model>/fruit_math/'
# using prompts/gemini_pos_tagging_fruit_math.txt against your own generations.

experiment_name: "fruit_math"
save_dir: "./outputs/fruit_math/boosting/qvl_7b"
device: "auto"

data:
  csv_path: "data/csv/fruit_math_oid_scaled1K.csv"
  image_base_dir: "data"
  black_image_path: "data/blank_black_image.png"

generation:
  num_tokens_to_generate: 25

model:
  type: "qwen_25_vl"
  model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
  torch_dtype: "bfloat16"
  attn_implementation: "eager"

task:
  image_type: 'actual'
  name: "fruit_math"
  prompt_template: 'fruit_math_prompt'

blocking:
  use_blocking: False

boosting:
  use_boosting: True
  type: 'multiplicative' # 'multiplicative' | 'logit'
  chunk_to_boost: ['image', 'text']
  boost_factor: 50.0
  layers_to_boost: 'all'
  style:
    type: 'precomputed'
    pos_dir: 'data/tagged_outputs/otat_tagged_outputs/FrMaSc'
    model: 'qvl_7b'
    pos_tag_to_block: ['FRUIT_CONCEPT', 'MATH_ANSWER']
    only_first: True
